<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가치사슬 연습 · 원두 산지 → 로스팅 → 손님</title>
<style>
  body { font-family: "Malgun Gothic", system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 32px; }
  #diagram { padding: 16px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
  pre { background: #f5f5f5; padding: 14px 16px; border-radius: 8px; font-size: 0.95rem; overflow-x: auto; }
</style>
</head>
<body>
<h1>원두 산지 → 로스팅 → 손님</h1>

<div id="diagram"></div>

<h2>이 그림을 만든 Mermaid 글</h2>
<pre id="source">flowchart LR
    A["원두 산지"] --> B["로스팅"]
    B --> C["손님"]</pre>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  // 아래 <pre>에 보이는 글을 그대로 읽어서 그림을 그린다. 그래서 글과 그림이 항상 같다.
  mermaid.initialize({ startOnLoad: false });
  const text = document.getElementById("source").textContent;
  mermaid.render("valuechain-svg", text).then(({ svg }) => {
    document.getElementById("diagram").innerHTML = svg;
  });
</script>
</body>
</html>
